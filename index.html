<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLYSH</title>
<script>
  // 2026-11-19: PLYSH 주소가 /cal → /plysh 로 바뀌었어요. 예전 주소(하위 페이지 포함)는 새 주소로 넘겨요.
  var p = location.pathname.replace(/^\/cal(\/|$)/, '/plysh$1');
  location.replace(p + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=/plysh/">
</head><body style="font-family:sans-serif;padding:40px;color:#555">PLYSH 새 주소로 이동 중이에요… <a href="/plysh/">iamhyona.github.io/plysh</a></body></html>
