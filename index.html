<style>
:root { --bg:#f2f4f6; --card:#fff; --line:#e5e8eb; --txt:#191f28; --sub:#4e5968; --mute:#8b95a1; --faint:#b0b8c1;
  --acc:#3182f6; --red:#ef4444; --chip:#f2f4f6; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--txt); font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif; font-size:15px; letter-spacing:-0.01em; }
button,input,select,textarea { font:inherit; color:inherit; letter-spacing:inherit; }
button { cursor:pointer; }
.mute { color:var(--mute); }
.hide { display:none !important; }

/* 상단 */
header { position:sticky; top:0; z-index:10; background:var(--bg); padding:calc(10px + env(safe-area-inset-top)) 16px 0; }
.hd { display:flex; align-items:center; justify-content:space-between; height:44px; max-width:560px; margin:0 auto; }
.brand { border:0; background:none; padding:0; font-size:17px; font-weight:800; letter-spacing:.06em; }
.mode { display:flex; max-width:560px; margin:8px auto 0; background:#e5e8eb; border-radius:12px; padding:3px; gap:2px; }
.mode button { flex:1; border:0; background:none; border-radius:10px; padding:8px 0; font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--mute); }
.hd .mode { margin:0; flex:none; border-radius:11px; padding:3px; }
.hd .mode button { flex:none; padding:7px 7px; font-size:11px; letter-spacing:.03em; border-radius:9px; }
.mode button.on { background:#fff; color:var(--txt); box-shadow:0 1px 3px rgba(0,0,0,.08); }
.mode.off button.on { background:none; box-shadow:none; color:var(--mute); }
.arw .tod { width:auto; border-radius:999px; padding:0 12px; font-size:13px; font-weight:700; }
.hm { margin:6px 4px 14px; } .hm small { display:block; color:var(--mute); font-size:13px; font-weight:600; } .hm b { font-size:22px; font-weight:800; }
.mk { font-size:13px; font-weight:800; letter-spacing:.06em; }
.pbar { height:6px; border-radius:3px; background:var(--chip); overflow:hidden; margin:-4px 0 14px; } .pbar i { display:block; height:100%; background:var(--txt); }
.lnk { border:0; background:var(--txt); color:#fff; border-radius:999px; padding:9px 16px; font-size:14px; font-weight:700; margin-top:12px; }
.fc { background:#fff; border-radius:20px; overflow:hidden; margin-bottom:12px; }
.fc .fi { border:0; padding:0; display:block; width:100%; background:#e5e8eb; }
.fc .fi img { width:100%; display:block; max-height:560px; object-fit:cover; }
.fc .fm { padding:12px 16px 14px; } .fc .fcat { font-size:12px; font-weight:700; color:var(--sub); background:var(--chip); border-radius:999px; padding:3px 9px; }
.fc .fm p { margin:8px 0 0; font-size:15px; line-height:1.5; color:var(--txt); white-space:pre-wrap; }
.pcal .grid button { min-height:0; aspect-ratio:1; padding:0; overflow:hidden; border-radius:8px; justify-content:flex-start; }
.pcal .grid button img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.pcal .grid button .dnum { position:relative; width:auto; height:auto; line-height:1; padding:4px 0 0; font-size:12px; border-radius:0; }
.pcal .grid button.has .dnum { color:#fff; text-shadow:0 0 3px rgba(0,0,0,.5); }
.pcal .grid button.td .dnum { background:none; color:var(--acc); } .pcal .grid button.td.has .dnum { color:#fff; }
.pcal .grid button em { position:absolute; right:3px; bottom:3px; font-style:normal; font-size:10px; font-weight:700; color:#fff; background:rgba(0,0,0,.45); border-radius:6px; padding:1px 4px; }
.dcal .grid button { min-height:46px; }
.dcal .grid .dts i { width:8px; height:8px; }
.ym { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.ym button { border:0; padding:0; aspect-ratio:1; border-radius:14px; background:#fff; position:relative; overflow:hidden; text-align:left; }
.ym button img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.ym button .yl { position:absolute; left:10px; bottom:8px; display:flex; flex-direction:column; }
.ym button img + .yl { color:#fff; text-shadow:0 0 4px rgba(0,0,0,.45); }
.ym button .yl b { font-size:15px; } .ym button .yl small { font-size:12px; opacity:.9; }
.ym button.fu { opacity:.4; }
.dyv .dh { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.dyv p { margin:0; font-size:16px; line-height:1.75; white-space:pre-wrap; word-break:break-all; }
.dyv .ph { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-top:16px; }
.dyv .ph button { border:0; padding:0; aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--chip); }
.dyv .ph img { width:100%; height:100%; object-fit:cover; display:block; }
.pg.ig { gap:2px; border-radius:0; margin:0 -16px 12px; }
.pg.ig button { aspect-ratio:3/4; background:#e5e8eb; }
.f1 { margin:0 -16px 18px; background:#fff; }
.f1 .fi { border:0; padding:0; display:block; width:100%; background:#fff; min-height:120px; }
.f1 .fi img { width:100%; height:auto; display:block; }
.f1 .fm { padding:10px 16px 14px; } .f1 .fcat { font-size:12px; font-weight:700; color:var(--sub); background:var(--chip); border-radius:999px; padding:3px 9px; }
.f1 .fm p { margin:8px 0 0; font-size:15px; line-height:1.5; white-space:pre-wrap; }
.pg button .mul { position:absolute; top:7px; right:7px; width:18px; height:18px; filter:drop-shadow(0 0 2px rgba(0,0,0,.4)); }
.car { position:relative; background:#fff; }
.cs { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.cs::-webkit-scrollbar { display:none; }
.cs .fi { flex:0 0 100%; scroll-snap-align:start; scroll-snap-stop:always; }
.car.multi .cs .fi { aspect-ratio:4/5; }
.car.multi .cs .fi img { width:100%; height:100%; object-fit:cover; }
.car .cn { position:absolute; top:12px; right:12px; background:rgba(0,0,0,.55); color:#fff; font-size:12px; font-weight:600; border-radius:999px; padding:4px 9px; }
.f1 .dots { display:flex; justify-content:center; gap:4px; padding:10px 0 0; }
.f1 .dots i { width:6px; height:6px; border-radius:50%; background:#d1d6db; } .f1 .dots i.on { background:var(--acc); }
.fcnt { display:flex; justify-content:space-between; align-items:baseline; margin:2px 2px 10px; font-size:13px; font-weight:600; color:var(--mute); }
.fcnt b { color:var(--txt); font-size:15px; }
.ym { gap:2px !important; margin:0 -16px; }
.ym button { border-radius:0 !important; aspect-ratio:3/4 !important; }
.st3, .st4 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:6px; }
.st4 { grid-template-columns:repeat(4,1fr); margin:0; }
.st3 small, .st4 small { display:block; font-size:12px; color:var(--mute); margin-bottom:3px; }
.st3 b, .st4 b { font-size:18px; font-weight:800; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .st4 b { font-size:16px; }
.st3 em, .st4 em { display:block; font-style:normal; font-size:11px; color:var(--mute); margin-top:3px; white-space:nowrap; }
.mini em { display:block; font-style:normal; font-size:11px; color:var(--mute); }
.mbar.sm { height:96px; margin-top:16px; }
.sub2 { font-size:13px; font-weight:700; color:var(--mute); margin:18px 0 2px; }
.lows li { display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line); } .lows li:first-child { border-top:0; }
.lows .n { flex:1; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .lows .v { font-size:13px; color:var(--sub); }
.wmood { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:16px; text-align:center; }
.wmood i { display:block; width:28px; height:28px; border-radius:50%; margin:0 auto 5px; }
.wmood span { font-size:11px; color:var(--mute); } .wmood .td span { color:var(--txt); font-weight:800; }
.dprev { margin:0; font-size:15px; line-height:1.65; color:var(--sub); white-space:pre-wrap; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
.dprev.sm { margin-top:14px; font-size:14px; -webkit-line-clamp:2; }
.wdh, .act5 { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.wdh span { text-align:center; font-size:11px; color:var(--mute); padding-bottom:5px; }
.act5 i { display:block; aspect-ratio:1; border-radius:6px; background:#eef0f3; }
.act5 i.a1, .legend i.a1 { background:#c7d2fe; } .act5 i.a2, .legend i.a2 { background:#818cf8; } .act5 i.a3, .legend i.a3 { background:#4338ca; }
.act5 i.f { background:#f7f8fa; } .act5 i.td { box-shadow:inset 0 0 0 2px var(--txt); }
.thumbs { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; margin-top:14px; border-radius:10px; overflow:hidden; }
.thumbs img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:var(--chip); }
.fcnt a { font-size:13px; font-weight:600; text-decoration:none; }
.hd .ib { width:34px; height:34px; } .hd .ib svg { width:18px; height:18px; }
.srbar { display:flex; align-items:center; gap:8px; background:var(--chip); border-radius:14px; padding:0 8px 0 14px; margin-bottom:12px; }
.srbar svg { width:18px; height:18px; color:var(--mute); flex:none; }
.srbar input { flex:1; min-width:0; border:0; background:none; outline:0; font-size:16px; padding:13px 0; -webkit-appearance:none; }
.srbar input::-webkit-search-cancel-button { display:none; }
.srbar button { border:0; background:none; color:var(--mute); font-size:14px; padding:8px; }
.srs { margin:0 -22px 4px; padding:0 22px; } .srs button { background:var(--chip); } .srs button.on { background:var(--txt); color:#fff; }
.srh { font-size:13px; font-weight:800; color:var(--sub); margin:18px 2px 8px; display:flex; gap:6px; align-items:baseline; } .srh b { color:var(--acc); } .srh small { color:var(--mute); font-weight:600; }
.srx { display:flex; flex-wrap:wrap; gap:6px; } .srx button { border:0; background:var(--chip); border-radius:999px; padding:8px 13px; font-size:14px; font-weight:600; color:var(--sub); }
.srn { font-size:13px; color:var(--mute); line-height:1.6; margin:14px 2px 0; } .srn2 { font-size:12px; color:var(--mute); margin:8px 2px 0; }
.sri { display:block; width:100%; text-align:left; border:0; background:var(--chip); border-radius:14px; padding:12px 14px; margin-bottom:6px; }
.sri .srd { font-size:13px; font-weight:800; margin-right:6px; } .sri .mood { padding:2px 7px; font-size:11px; background:#fff; }
.sri p { margin:6px 0 0; font-size:14px; line-height:1.55; color:var(--sub); }
.sri.go { background:var(--txt); } .sri.go .srd, .sri.go p { color:#fff; }
.sri mark, .srn2 mark, .lows mark { background:#fff1a8; color:inherit; border-radius:3px; padding:0 1px; }
.pg.srg { border-radius:12px; } .pg.srg button { aspect-ratio:1; }
.geo { font-size:12px; color:var(--mute); margin:6px 2px 0; min-height:16px; }
.fpl { font-size:12px; color:var(--mute); margin-left:8px; } .fpl::before { content:'📍'; margin-right:2px; }
.pvl { margin:6px 0 0; font-size:13px; color:var(--sub); }
.dc.none { padding:14px 20px; background:rgba(255,255,255,.55); } .dc.none .dh { margin:0; }
.hr { display:flex; align-items:center; gap:5px; }
.hdt { font-size:13px; font-weight:600; color:var(--mute); }
.ib { width:38px; height:38px; border:0; border-radius:50%; background:#fff; display:inline-flex; align-items:center; justify-content:center; color:var(--sub); padding:0; flex:none; }
.ib svg { width:19px; height:19px; }
nav { display:flex; justify-content:flex-start; gap:20px; max-width:560px; margin:6px auto 0; border-bottom:1px solid var(--line); }
nav button { flex:none; border:0; background:none; padding:12px 0 10px; font-size:12px; font-weight:700; letter-spacing:.03em; color:var(--faint); border-bottom:2px solid transparent; margin-bottom:-1px; }
nav button.on { color:var(--txt); border-bottom-color:var(--txt); }

main { max-width:560px; margin:0 auto; padding:14px 16px calc(110px + env(safe-area-inset-bottom)); }
.card { background:var(--card); border-radius:20px; padding:22px 20px; margin-bottom:12px; }
.ct { font-size:17px; font-weight:700; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.ct small { font-size:13px; font-weight:500; color:var(--mute); }
.ct a { color:var(--acc); font-size:13px; font-weight:600; text-decoration:none; }
.nav2 { display:flex; align-items:center; justify-content:space-between; margin:4px 0 12px; }
.nav2 .lbl { border:0; background:none; font-size:20px; font-weight:800; padding:4px; }
.arw { display:flex; gap:6px; }
.arw button { width:36px; height:36px; border-radius:50%; border:0; background:#fff; font-size:18px; color:var(--sub); }
.arw button:disabled { opacity:.35; }
.empty { text-align:center; color:var(--mute); padding:28px 0; font-size:14px; line-height:1.6; }
.ld { text-align:center; color:var(--mute); padding:60px 0; }
.big1 small { display:block; color:var(--mute); font-size:13px; margin-bottom:6px; }
.big1 b { font-size:30px; font-weight:800; letter-spacing:-0.02em; }
.big1 .pct { font-size:.6em; margin-left:1px; }
.big1 .sub { margin-top:8px; font-size:13px; color:var(--sub); }
.up { color:var(--acc); } .dn { color:var(--red); }
.mini { display:grid; grid-template-columns:1fr 1fr 1fr; background:#fff; border-radius:20px; padding:16px 8px; margin-bottom:12px; text-align:center; }
.mini small { display:block; color:var(--mute); font-size:12px; margin-bottom:4px; } .mini b { font-size:16px; }


/* 플로팅 버튼 */
.fab { position:fixed; right:20px; bottom:calc(24px + env(safe-area-inset-bottom)); width:60px; height:60px; border-radius:50%;
  border:0; background:var(--txt); color:#fff; box-shadow:0 8px 20px rgba(25,31,40,.25); z-index:15; display:flex; align-items:center; justify-content:center; }
.fab::before, .fab::after { content:''; position:absolute; width:22px; height:2.5px; background:#fff; border-radius:2px; }
.fab::after { transform:rotate(90deg); }

/* 바텀시트 */
.dimbg { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30; opacity:0; pointer-events:none; transition:opacity .2s; }
.bs { position:fixed; left:0; right:0; bottom:0; z-index:31; background:#fff; border-radius:24px 24px 0 0; max-height:92vh; overflow:auto;
  padding:22px 20px calc(20px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .22s ease, visibility .22s; max-width:560px; margin:0 auto; visibility:hidden; }
.bs { overflow-x:hidden; overscroll-behavior:contain; touch-action:pan-y; }
html { overflow-x:hidden; } body { overflow-x:clip; max-width:100%; }
html.lock { overflow:hidden; }
.bs.open { transform:none; visibility:visible; } .dimbg.open { opacity:1; pointer-events:auto; }
.bs h3 { margin:0 0 16px; font-size:20px; }
.bsh { position:sticky; top:-22px; z-index:2; height:46px; margin:-22px -20px 4px; background:#fff; display:flex; justify-content:flex-end; align-items:center; padding:0 14px; touch-action:none; }
.bsh i { position:absolute; left:50%; top:9px; width:40px; height:5px; margin-left:-20px; border-radius:3px; background:#d1d6db; }
.bsx { width:32px; height:32px; border:0; border-radius:50%; background:var(--chip); color:var(--sub); display:flex; align-items:center; justify-content:center; padding:0; margin-top:6px; }
.bsx svg { width:16px; height:16px; }
.fl { font-size:13px; color:var(--mute); margin:16px 2px 8px; font-weight:600; }
.frow { display:flex; gap:8px; margin-bottom:10px; }
.f { flex:1; min-width:0; } .f label { display:block; font-size:12px; color:var(--mute); margin:0 0 5px 2px; font-weight:600; }
.f input { width:100%; border:0; background:var(--chip); border-radius:12px; padding:12px; outline:0; font-size:16px; height:46px; min-width:0; max-width:100%; display:block; -webkit-appearance:none; appearance:none; }
.f input[type=date] { color:var(--txt); text-align:left; line-height:22px; }
.f input::-webkit-date-and-time-value { text-align:left; margin:0; min-height:22px; }
.f input::-webkit-datetime-edit { padding:0; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chips button { border:0; background:var(--chip); border-radius:999px; padding:8px 13px; font-size:14px; color:var(--sub); font-weight:500; }
.chips button.on { background:var(--txt); color:#fff; }
.chips input { border:0; background:var(--chip); border-radius:999px; padding:8px 13px; font-size:16px; width:130px; outline:0; }
.pal { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
.pal button { border:0; aspect-ratio:1; border-radius:12px; padding:0; display:flex; align-items:center; justify-content:center; }
.pal button svg { width:18px; height:18px; opacity:0; } .pal button.on svg { opacity:1; }
.acts { display:flex; gap:8px; margin-top:22px; }
.acts button { flex:1; border:0; border-radius:14px; padding:16px; font-weight:700; font-size:16px; }
.save { background:var(--txt); color:#fff; } .del { background:#fef2f2; color:var(--red); flex:0 0 96px !important; }
.del.sure { flex:0 0 170px !important; background:var(--red); color:#fff; }
.save:disabled { opacity:.4; }
textarea.dx { width:100%; border:0; background:var(--chip); border-radius:14px; padding:14px; font-size:16px; line-height:1.6; min-height:220px; outline:0; resize:none; display:block; }
.moods { display:flex; gap:6px; }
.moods button { flex:1; border:0; background:var(--chip); border-radius:12px; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:12px; font-weight:600; color:var(--mute); }
.moods button i { width:22px; height:22px; border-radius:50%; display:block; opacity:.35; }

.moods button.on i { opacity:1; }
.dyp { display:flex; gap:6px; overflow-x:auto; margin-top:10px; }
.dyp img { width:64px; height:64px; object-fit:cover; border-radius:10px; flex:none; }
.pdrop { display:block; border:2px dashed var(--line); border-radius:16px; padding:18px; text-align:center; color:var(--mute); font-weight:600; font-size:14px; cursor:pointer; }
.pdrop .pp { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-top:12px; }
.pdrop .pp:empty { display:none; }
.pdrop .pp img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; display:block; }
.pvi { width:100%; border-radius:16px; display:block; background:#fff; min-height:200px; max-height:62vh; object-fit:contain; }
.pvm { display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-size:14px; color:var(--mute); font-weight:600; }
.pvm b { color:var(--txt); }
.pvt { margin:10px 2px 0; font-size:15px; line-height:1.6; white-space:pre-wrap; }
.pvn { font-size:12px; color:var(--faint); text-align:center; margin-top:8px; }
.mrow { display:flex; align-items:center; gap:4px; padding:4px 0; }
.mrow + .mrow { border-top:1px solid #f2f4f6; }
.mrow input { flex:1; min-width:0; border:0; background:none; font-size:16px; padding:8px 4px; outline:0; border-radius:8px; }
.mrow input:focus { background:var(--chip); }
.mrow .hb { flex:1; min-width:0; border:0; background:none; text-align:left; padding:10px 4px; font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
.mrow .hb span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .mrow .hb small { color:var(--mute); font-weight:500; font-size:12px; }
.mrow > button:not(.hb) { flex:none; width:34px; height:34px; border:0; background:none; border-radius:50%; color:var(--mute); font-size:15px; }
.mrow > button:not(.hb):disabled { opacity:.25; }
.mrow .x { color:var(--red) !important; font-size:18px !important; }
.madd { display:flex; gap:8px; margin-top:12px; }
.madd input { flex:1; min-width:0; border:0; background:var(--chip); border-radius:12px; padding:12px; font-size:16px; outline:0; }
.madd button { border:0; background:var(--txt); color:#fff; border-radius:12px; padding:0 18px; font-weight:700; }

<script>
var $ = function (s) { return document.querySelector(s); };
var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
var ls = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
var W = ['일', '월', '화', '수', '목', '금', '토'];
function pad(n) { return (n < 10 ? '0' : '') + n; }
function P(s) { var a = s.split('-'); return new Date(+a[0], a[1] - 1, +a[2]); }
function F(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addD(s, n) { var d = P(s); d.setDate(d.getDate() + n); return F(d); }
function sunOf(s) { var d = P(s); d.setDate(d.getDate() - d.getDay()); return F(d); }
function dDiff(a, b) { return Math.round((P(b) - P(a)) / 864e5); }
function md(s) { var d = P(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }
function mdw(s) { return md(s) + ' ' + W[P(s).getDay()] + '요일'; }
function full(s) { return s + '(' + W[P(s).getDay()] + ')'; }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var TODAY = F(new Date());
// 구분별 색 (제작일정 시트 색 규칙과 같은 계열)
var KIND = { '디자인': '#3182f6', '리터칭': '#16a34a', '소속사': '#6b7684', '데드라인': '#e1306c', '공식': '#ef4444', '업무': '#8b5cf6', '휴가': '#f59e0b' };
var KIND_BG = { '디자인': '#e8f1ff', '리터칭': '#e6f6ec', '소속사': '#f0f2f4', '데드라인': '#fde8ef', '공식': '#fdecec', '업무': '#f1ebfe', '휴가': '#fef3dc' };
var PROJ_K = ['디자인', '리터칭', '소속사', '데드라인', '공식'], WORK_K = ['업무', '휴가'];
var PCOL = ['#3182f6', '#e1306c', '#16a34a', '#f59e0b', '#8b5cf6', '#0ea5e9', '#ef4444', '#14b8a6', '#a855f7', '#f97316'];
var S = { pin: ls.get('d4:pin') || '', view: ls.get('d4:view') || 'home', y: +TODAY.slice(0, 4), m: +TODAY.slice(5, 7), ws: sunOf(TODAY),
  off: JSON.parse(ls.get('d4:off') || '{}'), D: null, sel: null };
if (['home', 'month', 'week', 'project'].indexOf(S.view) < 0) S.view = 'home';

var API = 'https://script.google.com/macros/s/AKfycbzpvNlxuCa95ZxGvg8N4SiPqmsPzyYx_n9ikhmdRlIng7VzWzks_WS6DDyviPXsfoaO/exec';
var API_READ = { appHasPin: 1, appCheck: 1, appAll: 1 };
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1), tries = API_READ[fn] ? 3 : 1;
  function once() {
    return fetch(API, { method: 'POST', body: JSON.stringify({ api: fn, args: args }) })
      .then(function (r) { if (!r.ok) { var e = new Error('서버에 연결하지 못했어요 (' + r.status + ')'); e.retry = true; throw e; } return r.json(); },
        function (e) { var x = new Error(/Failed to fetch|NetworkError|Load failed/.test(String(e && e.message)) ? '인터넷 연결을 확인해 주세요' : (e.message || String(e))); x.retry = true; throw x; })
      .then(function (o) { if (o && o.ok && !('data' in o)) { var e = new Error('서버에 전달되지 않았어요. 다시 시도해 주세요'); e.retry = true; throw e; } return o; });
  }
  function run(n) { return once().catch(function (e) { if (e.retry && n > 1) return new Promise(function (ok) { setTimeout(ok, 1200); }).then(function () { return run(n - 1); }); throw e; }); }
  return run(tries).then(function (o) { if (!o.ok) throw new Error(o.error || '오류가 났어요'); return o.data; });
}
var APP_VER = '20261005a';
function checkUpdate() {
  fetch('index.html?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
    var m = t.match(/var APP_VER = '(\w+)'/);
    if (m && m[1] !== APP_VER && !document.querySelector('.bs.open')) location.replace(location.pathname + '?v=' + m[1]);
  }).catch(function () {});
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) return;
  checkUpdate();
  var t = F(new Date()); if (t !== TODAY) { TODAY = t; render(); }
  if (S.D && Date.now() - (S.at || 0) > 60000) load();
});
checkUpdate();
function errMsg(e) { return (e && e.message ? e.message : String(e)).replace(/^(Exception|Error):\s*/, ''); }
function toast(t) { var el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { el.style.display = 'none'; }, 2200); }

/* ───── 데이터 ───── */
function setData(d) {
  var files = d.files || [], pi = 0;
  files.forEach(function (f) { f.color = f.type === 'work' ? KIND['업무'] : PCOL[pi++ % PCOL.length]; f.short = f.type === 'work' ? '업무' : f.name.split(/\s+/)[0]; });
  var FM = {}; files.forEach(function (f) { FM[f.id] = f; });
  d.events.forEach(function (e) { e.file = FM[e.f]; });
  d.events = d.events.filter(function (e) { return e.file; });
  d.events.sort(function (a, b) { return a.d === b.d ? (a.file.type === b.file.type ? (a.s - b.s) : (a.file.type === 'proj' ? -1 : 1)) : (a.d < b.d ? -1 : 1); });
  d.FM = FM; S.D = d;
}
function load() {
  $('#rfBtn').classList.add('spin');
  return call('appAll', S.pin).then(function (d) {
    S.at = Date.now(); ls.set('d4:data', JSON.stringify({ files: d.files, events: d.events, hol: d.hol, at: d.at }));
    setData(d); render();
  }).catch(function (e) {
    if (/PIN/.test(errMsg(e))) { S.pin = ''; ls.set('d4:pin', ''); return showPin(); }
    toast(errMsg(e));
  }).then(function () { $('#rfBtn').classList.remove('spin'); });
}
function cached() { try { return JSON.parse(ls.get('d4:data') || 'null'); } catch (e) { return null; } }
function vis() { return S.D.events.filter(function (e) { return !S.off[e.f]; }); }
function onDay(d, list) { return (list || vis()).filter(function (e) { return e.d === d; }); }
function hol(d) { return (S.D.hol || {})[d] || ''; }
function label(e) { return (e.file.type === 'proj' ? e.file.short + ' ' : '') + e.t; }

/* ───── 화면 ───── */
function render() {
  if (!S.D) return;
  $$('#nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === S.view); });
  ({ home: renderHome, month: renderMonth, week: renderWeek, project: renderProject })[S.view]();
}
$$('#nav button').forEach(function (b) { b.onclick = function () { S.view = b.dataset.v; ls.set('d4:view', S.view); window.scrollTo(0, 0); render(); }; });
$('#brand').onclick = function () { S.view = 'home'; ls.set('d4:view', 'home'); window.scrollTo(0, 0); render(); };
$('#rfBtn').onclick = function () { load().then(function () { toast('시트에서 새로 불러왔어요'); }); };

function filterBar() {
  var fs = S.D.files;
  return '<div class="tabs2" id="flt"><button data-f="" class="' + (fs.every(function (f) { return !S.off[f.id]; }) ? 'on' : '') + '">전체</button>' +
    fs.map(function (f) { return '<button data-f="' + f.id + '" class="' + (S.off[f.id] ? '' : 'on') + '"><i style="background:' + f.color + '"></i>' + esc(f.type === 'work' ? '업무일지' : f.name) + '</button>'; }).join('') + '</div>';
}
function bindFilter() {
  $$('#flt button').forEach(function (b) {
    b.onclick = function () {
      var id = b.dataset.f;
      if (!id) S.off = {};
      else if (S.off[id]) delete S.off[id];
      else {
        // 모두 켜진 상태에서 누르면 그것만 보기
        if (!Object.keys(S.off).length) S.D.files.forEach(function (f) { if (f.id !== id) S.off[f.id] = 1; });
        else S.off[id] = 1;
      }
      if (S.D.files.every(function (f) { return S.off[f.id]; })) S.off = {};
      ls.set('d4:off', JSON.stringify(S.off)); var y0 = window.scrollY; render(); window.scrollTo(0, y0);
    };
  });
}
function legend() {
  return '<div class="legend2">' + ['디자인', '리터칭', '소속사', '데드라인', '공식', '업무', '휴가'].map(function (k) { return '<span><i style="background:' + KIND[k] + '"></i>' + k + '</span>'; }).join('') + '</div>';
}
function navBar(lbl, prevId, nextId, todayBtn) {
  return '<div class="nav2"><span class="lbl">' + lbl + '</span><div class="arw">' + (todayBtn ? '<button class="tod" id="nT">오늘</button>' : '') + '<button id="' + prevId + '">‹</button><button id="' + nextId + '">›</button></div></div>';
}
function itemHtml(e, showDate) {
  var f = e.file, dl = e.k === '데드라인' || e.k === '공식';
  return '<button class="it" data-e="' + esc(e.id) + '">' + (showDate ? '<span class="d2' + (dl ? ' dl' : '') + '">' + (P(e.d).getMonth() + 1) + '/' + P(e.d).getDate() + ' ' + W[P(e.d).getDay()] + '</span>' : '') +
    '<span class="bar" style="background:' + KIND[e.k] + '"></span><span class="m"><div>' + esc(e.t) + '</div><small><span class="tag" style="background:' + KIND_BG[e.k] + ';color:' + KIND[e.k] + '">' + e.k + '</span>' +
    (f.type === 'proj' ? '<span style="color:' + f.color + '">' + esc(f.name) + '</span>' : '<span>업무일지</span>') + '</small></span></button>';
}
function bindItems(root) { (root ? root.querySelectorAll('[data-e]') : $$('[data-e]')).forEach(function (b) { b.onclick = function () { openEdit(b.dataset.e); }; }); }

// HOME: 오늘 · 이번 주 · 다가오는 데드라인 · 프로젝트별 다음 일정
function renderHome() {
  var L = vis(), td = onDay(TODAY, L), ws = sunOf(TODAY), we = addD(ws, 6);
  var h = '<div class="hm"><small>디자인4팀</small><b>' + mdw(TODAY) + (hol(TODAY) ? ' · ' + esc(hol(TODAY)) : '') + '</b></div>' + filterBar();
  h += '<div class="day td"><div class="dh"><b>오늘<small>' + td.length + '건</small></b><button class="add" data-add="' + TODAY + '">+ 추가</button></div>' +
    (td.length ? td.map(function (e) { return itemHtml(e); }).join('') : '<div class="empty2">오늘 일정이 없어요</div>') + '</div>';
  // 다가오는 데드라인·공식 (30일)
  var up = L.filter(function (e) { return (e.k === '데드라인' || e.k === '공식') && e.d > TODAY && e.d <= addD(TODAY, 30); });
  h += '<div class="sec">다가오는 데드라인 · 공식<small>30일</small></div><div class="day">' + (up.length ? up.slice(0, 12).map(function (e) {
    var n = dDiff(TODAY, e.d);
    return '<div style="display:flex;align-items:center;gap:8px"><span class="dd' + (n <= 3 ? ' soon' : '') + '">D-' + n + '</span><div style="flex:1;min-width:0">' + itemHtml(e, true) + '</div></div>';
  }).join('') : '<div class="empty2">30일 안에 데드라인이 없어요</div>') + '</div>';
  // 이번 주
  h += '<div class="sec">이번 주<small>' + md(ws) + ' – ' + md(we) + '</small></div>';
  for (var d = addD(TODAY, 1); d <= we; d = addD(d, 1)) {
    var l = onDay(d, L); if (!l.length) continue;
    h += dayCard(d, l);
  }
  if (TODAY === we || !L.some(function (e) { return e.d > TODAY && e.d <= we; })) h += '<div class="day"><div class="empty2">이번 주 남은 일정이 없어요</div></div>';
  h += '<p class="upd">' + (S.D.at ? '시트 기준 ' + new Date(S.D.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '') + '</p>';
  $('#main').innerHTML = h; bindFilter(); bindItems(); bindAdd();
}
function dayCard(d, l) {
  var hl = hol(d), w = P(d).getDay();
  return '<div class="day' + (d === TODAY ? ' td' : '') + '"><div class="dh"><b class="' + (hl || w === 0 || w === 6 ? 'hl' : '') + '">' + md(d) + ' ' + W[w] + '<small>' + (hl ? esc(hl) + ' · ' : '') + l.length + '건</small></b><button class="add" data-add="' + d + '">+ 추가</button></div>' +
    (l.length ? l.map(function (e) { return itemHtml(e); }).join('') : '<div class="empty2">일정 없음</div>') + '</div>';
}
function bindAdd() { $$('[data-add]').forEach(function (b) { b.onclick = function () { openEdit(null, b.dataset.add); }; }); }

// MONTH: 달력에 일정 막대
function renderMonth() {
  var y = S.y, m = S.m, first = y + '-' + pad(m) + '-01', start = sunOf(first), L = vis();
  var last = F(new Date(y, m, 0)), end = addD(sunOf(last), 6);
  var h = navBar(y + '년 ' + m + '월', 'nP', 'nN', first.slice(0, 7) !== TODAY.slice(0, 7)) + filterBar() + legend();
  h += '<div class="mcal"><div class="wd">' + W.map(function (w) { return '<div>' + w + '</div>'; }).join('') + '</div><div class="grid">';
  for (var d = start; d <= end; d = addD(d, 1)) {
    var l = onDay(d, L), w = P(d).getDay(), hl = hol(d), max = 4;
    h += '<button data-d="' + d + '" class="' + (d.slice(0, 7) !== first.slice(0, 7) ? 'out ' : '') + (d === TODAY ? 'td ' : '') + (hl ? 'hol ' : '') + (w === 0 ? 'sun ' : w === 6 ? 'sat ' : '') + (S.sel === d ? 'sel' : '') + '">' +
      '<span class="dn"><b>' + P(d).getDate() + '</b>' + (hl ? '<small>' + esc(hl) + '</small>' : '') + '</span>' +
      l.slice(0, l.length > max ? max - 1 : max).map(function (e) { return '<span class="ev" style="background:' + KIND[e.k] + '">' + esc(label(e)) + '</span>'; }).join('') +
      (l.length > max ? '<span class="evm">+' + (l.length - max + 1) + '</span>' : '') + '</button>';
  }
  h += '</div></div>';
  // 이 달 목록
  var ml = L.filter(function (e) { return e.d.slice(0, 7) === first.slice(0, 7); });
  h += '<div class="sec">' + m + '월 일정<small>' + ml.length + '건</small></div><div class="day list">' + (ml.length ? ml.map(function (e) { return itemHtml(e, true); }).join('') : '<div class="empty2">이 달 일정이 없어요</div>') + '</div>';
  $('#main').innerHTML = h; bindFilter(); bindItems();
  $('#nP').onclick = function () { S.m--; if (S.m < 1) { S.m = 12; S.y--; } render(); };
  $('#nN').onclick = function () { S.m++; if (S.m > 12) { S.m = 1; S.y++; } render(); };
  if ($('#nT')) $('#nT').onclick = function () { S.y = +TODAY.slice(0, 4); S.m = +TODAY.slice(5, 7); render(); };
  $$('.mcal .grid > button').forEach(function (b) { b.onclick = function () { openDay(b.dataset.d); }; });
}
// WEEK: 하루씩 카드
function renderWeek() {
  var ws = S.ws, we = addD(ws, 6), L = vis();
  var h = navBar(md(ws) + ' – ' + md(we), 'nP', 'nN', ws !== sunOf(TODAY)) + filterBar();
  for (var d = ws; d <= we; d = addD(d, 1)) h += dayCard(d, onDay(d, L));
  $('#main').innerHTML = h; bindFilter(); bindItems(); bindAdd();
  $('#nP').onclick = function () { S.ws = addD(S.ws, -7); render(); };
  $('#nN').onclick = function () { S.ws = addD(S.ws, 7); render(); };
  if ($('#nT')) $('#nT').onclick = function () { S.ws = sunOf(TODAY); render(); };
}
// PROJECT: 프로젝트별 진행
function renderProject() {
  var ps = S.D.files.filter(function (f) { return f.type === 'proj'; }), h = '';
  if (!ps.length) h += '<div class="card empty">제작일정 폴더에 프로젝트 시트가 없어요</div>';
  ps.forEach(function (f) {
    var L = S.D.events.filter(function (e) { return e.f === f.id; });
    var tot = f.from && f.to ? dDiff(f.from, f.to) : 0, gone = f.from ? Math.max(0, Math.min(tot, dDiff(f.from, TODAY))) : 0;
    var lastDl = L.filter(function (e) { return e.k === '공식' || e.k === '데드라인'; }).slice(-1)[0];
    var next = L.filter(function (e) { return e.d >= TODAY; }).slice(0, 4);
    var cnt = {}; L.forEach(function (e) { cnt[e.k] = (cnt[e.k] || 0) + 1; });
    var done = L.filter(function (e) { return e.d < TODAY; }).length;
    h += '<div class="pj"><div class="ph"><i style="background:' + f.color + '"></i><b>' + esc(f.name) + '</b><a href="' + esc(f.url) + '" target="_blank">시트 ›</a></div>' +
      '<div class="per">' + (f.from ? md(f.from) + ' – ' + md(lastDl ? lastDl.d : f.to) : '날짜를 읽지 못했어요') + '</div>' +
      '<div class="pbar"><i style="width:' + (L.length ? Math.round(done / L.length * 100) : 0) + '%"></i></div><div class="pct2"><span>지난 일정 ' + done + ' / ' + L.length + '</span><span>' + (lastDl ? (lastDl.d >= TODAY ? '마지막 일정까지 D-' + dDiff(TODAY, lastDl.d) : '마지막 일정 지남') : '') + '</span></div>' +
      '<div class="nx">' + (next.length ? next.map(function (e) { return itemHtml(e, true); }).join('') : '<div class="empty2">남은 일정이 없어요</div>') + '</div>' +
      '<div class="kc">' + PROJ_K.filter(function (k) { return cnt[k]; }).map(function (k) { return '<span style="background:' + KIND_BG[k] + ';color:' + KIND[k] + '">' + k + ' ' + cnt[k] + '</span>'; }).join('') + '</div>' +
      '<button class="more" data-p="' + f.id + '">전체 일정 보기</button></div>';
  });
  $('#main').innerHTML = h; bindItems();
  $$('[data-p]').forEach(function (b) { b.onclick = function () { openProj(b.dataset.p); }; });
}
function openProj(id) {
  var f = S.D.FM[id], L = S.D.events.filter(function (e) { return e.f === id; }), h = '', cur = '';
  $('#pvT').textContent = f.name;
  L.forEach(function (e) {
    var mm = e.d.slice(0, 7); if (mm !== cur) { h += (cur ? '</div>' : '') + '<div class="sec" style="margin-top:14px">' + (+mm.slice(5)) + '월</div><div class="list">'; cur = mm; }
    h += itemHtml(e, true);
  });
  if (cur) h += '</div>';
  $('#pvB').innerHTML = (h || '<div class="empty2">일정이 없어요</div>') + '<a class="more" style="display:block;text-align:center;text-decoration:none" href="' + esc(f.url) + '" target="_blank">시트에서 열기</a>';
  bindItems($('#pvB')); openBs('#pv');
}

/* ───── 하루 보기 ───── */
function openDay(d) {
  S.sel = d;
  var l = onDay(d), hl = hol(d);
  $('#dyT').textContent = mdw(d) + (hl ? ' · ' + hl : '');
  $('#dyB').innerHTML = l.length ? l.map(function (e) { return itemHtml(e); }).join('') : '<div class="empty2">일정이 없어요</div>';
  bindItems($('#dyB')); $('#dyAdd').onclick = function () { closeBs(); setTimeout(function () { openEdit(null, d); }, 230); };
  openBs('#dy');
}

/* ───── 입력 · 수정 ───── */
var ED = null;
function kindsOf(fid) { var f = S.D.FM[fid]; return f && f.type === 'work' ? WORK_K : PROJ_K; }
function openEdit(id, d) {
  var e = id ? S.D.events.filter(function (x) { return x.id === id; })[0] : null;
  var fs = S.D.files, def = (fs.filter(function (f) { return !S.off[f.id]; })[0] || fs[0] || {}).id;
  ED = { id: id, e: e, f: e ? e.f : (ED && ED.lastF && S.D.FM[ED.lastF] ? ED.lastF : def), k: e ? e.k : '' };
  if (!ED.k) ED.k = kindsOf(ED.f)[0];
  $('#edT').textContent = e ? '일정 수정' : '일정 추가';
  $('#edD').value = e ? e.d : (d || TODAY); $('#edX').value = e ? e.t : '';
  $('#edDel').classList.toggle('hide', !e); unsure($('#edDel'));
  var was = !!$('.bs.open'); drawEdit(); closeBs(); setTimeout(function () { openBs('#ed'); }, was ? 230 : 0);
}
function drawEdit() {
  $('#edF').innerHTML = S.D.files.map(function (f) { return '<button data-f="' + f.id + '" class="' + (ED.f === f.id ? 'on' : '') + '"><i style="background:' + f.color + '"></i>' + esc(f.type === 'work' ? '업무일지' : f.name) + '</button>'; }).join('');
  var ks = kindsOf(ED.f); if (ks.indexOf(ED.k) < 0) ED.k = ks[0];
  $('#edK').innerHTML = ks.map(function (k) { return '<button data-k="' + k + '" class="' + (ED.k === k ? 'on' : '') + '"><i style="background:' + KIND[k] + '"></i>' + k + '</button>'; }).join('');
  var f = S.D.FM[ED.f];
  $('#edI').textContent = f ? (f.type === 'work' ? '업무일지 시트의 그 날짜 칸에 써요. (업무는 비어 있는 줄에, 대휴·휴가는 7행에)' : f.name + ' 시트에 써요 · ' + (f.from ? md(f.from) + ' – ' + md(f.to) + ' 사이 날짜만 가능' : '')) : '';
  $$('#edF button').forEach(function (b) { b.onclick = function () { ED.f = b.dataset.f; drawEdit(); }; });
  $$('#edK button').forEach(function (b) { b.onclick = function () { ED.k = b.dataset.k; drawEdit(); }; });
}
$('#edS').onclick = function () {
  var t = $('#edX').value.trim(), d = $('#edD').value;
  if (!d) return toast('날짜를 선택해 주세요');
  if (!t) return toast('내용을 적어 주세요');
  var f = S.D.FM[ED.f]; if (f.type === 'proj' && f.from && (d < f.from || d > f.to)) return toast('이 일정표에 없는 날짜예요 (' + md(f.from) + ' – ' + md(f.to) + ')');
  var btn = $('#edS'); btn.classList.add('busy'); ED.lastF = ED.f;
  var e = ED.e, kSlot = function (k) { return k === '리터칭' ? '디자인' : k; };
  var p = e ? call('appEdit', S.pin, { id: e.id, old: e.t, f: ED.f, d: d, k: ED.k, t: t, moved: e.f !== ED.f || e.d !== d || kSlot(e.k) !== kSlot(ED.k) })
    : call('appAdd', S.pin, { f: ED.f, d: d, k: ED.k, t: t });
  p.then(function () { closeBs(); toast('시트에 저장했어요'); return load(); })
    .catch(function (er) { toast(errMsg(er)); }).then(function () { btn.classList.remove('busy'); });
};
sure($('#edDel'), function () {
  var e = ED.e, btn = $('#edDel'); btn.classList.add('busy');
  call('appEdit', S.pin, { id: e.id, old: e.t, t: '' }).then(function () { closeBs(); toast('삭제했어요'); return load(); })
    .catch(function (er) { toast(errMsg(er)); }).then(function () { btn.classList.remove('busy'); });
});
$('#fab').onclick = function () {
  var d = S.view === 'month' ? (S.sel && S.sel.slice(0, 7) === S.y + '-' + pad(S.m) ? S.sel : (TODAY.slice(0, 7) === S.y + '-' + pad(S.m) ? TODAY : S.y + '-' + pad(S.m) + '-01')) : S.view === 'week' ? (TODAY >= S.ws && TODAY <= addD(S.ws, 6) ? TODAY : S.ws) : TODAY;
  openEdit(null, d);
};
$('#setBtn').onclick = function () {
  $('#stB').innerHTML = S.D ? S.D.files.map(function (f) {
    return '<a class="it" style="text-decoration:none;color:inherit" href="' + esc(f.url) + '" target="_blank"><span class="bar" style="background:' + f.color + '"></span><span class="m"><div>' + esc(f.type === 'work' ? '@4팀_업무일지' : f.name) + '</div><small>' + (f.type === 'work' ? '업무 일정' : '제작일정 · ' + (f.from ? md(f.from) + ' – ' + md(f.to) : '')) + ' · ' + S.D.events.filter(function (e) { return e.f === f.id; }).length + '건</small></span></a>';
  }).join('') : '';
  openBs('#st');
};

/* ───── 바텀시트 ───── */
function openBs(id) {
  var top = Math.round($('header').getBoundingClientRect().bottom);
  $('#dimbg').style.top = top + 'px';
  $(id).style.maxHeight = (window.innerHeight - top - 8) + 'px';
  $(id).scrollTop = 0;
  $('#dimbg').classList.add('open'); $(id).classList.add('open');
  document.documentElement.classList.add('lock');
}
function bsSwipe(b) {
  var y0 = null, dy = 0;
  b.addEventListener('touchstart', function (e) { if (b.scrollTop > 0 && !e.target.closest('.bsh')) { y0 = null; return; } y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
  b.addEventListener('touchmove', function (e) {
    if (y0 === null) return; dy = e.touches[0].clientY - y0;
    if (dy > 0) { b.style.transition = 'none'; b.style.transform = 'translateY(' + dy + 'px)'; if (e.cancelable) e.preventDefault(); }
    else { y0 = null; b.style.transition = ''; b.style.transform = ''; }
  }, { passive: false });
  b.addEventListener('touchend', function () { if (y0 === null) return; b.style.transition = ''; b.style.transform = ''; if (dy > 80) closeBs(); y0 = null; });
}
$$('.bs').forEach(function (b) {
  var h = document.createElement('div'); h.className = 'bsh';
  h.innerHTML = '<i></i><button type="button" class="bsx" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  b.insertBefore(h, b.firstChild); h.querySelector('.bsx').onclick = closeBs; bsSwipe(b);
});
function closeBs() { document.documentElement.classList.remove('lock'); $('#dimbg').classList.remove('open'); $$('.bs').forEach(function (b) { b.classList.remove('open'); }); if (document.activeElement) document.activeElement.blur(); if (S.view === 'month' && S.sel) { S.sel = null; } }
$('#dimbg').onclick = closeBs;
function sure(btn, fn) {
  btn.onclick = function () {
    if (!btn.classList.contains('sure')) { btn.classList.add('sure'); btn.dataset.t = btn.textContent; btn.textContent = '한 번 더 누르면 삭제'; clearTimeout(btn.h); btn.h = setTimeout(function () { unsure(btn); }, 3000); return; }
    unsure(btn); fn();
  };
}
function unsure(btn) { if (btn.classList.contains('sure')) { btn.classList.remove('sure'); btn.textContent = btn.dataset.t; } }

/* ───── 시작: PIN ───── */
var pinMode = 'enter';
function showPin() {
  $('#pinScr').classList.remove('hide'); $('#pinIn').value = '';
  call('appHasPin').then(function (has) {
    pinMode = has ? 'enter' : 'set';
    $('#pinMsg').textContent = has ? '팀 PIN 4자리를 입력해 주세요' : '처음이에요. 팀이 함께 쓸 PIN 4자리를 정해 주세요';
  }).catch(function () {});
  setTimeout(function () { $('#pinIn').focus(); }, 100);
}
$('#pinBtn').onclick = function () {
  var p = $('#pinIn').value.trim();
  if (!/^\d{4}$/.test(p)) return toast('숫자 4자리로 입력해 주세요');
  var b = $('#pinBtn'); b.classList.add('busy');
  (pinMode === 'set' ? call('appSetPin', p) : call('appCheck', p)).then(function () {
    S.pin = p; ls.set('d4:pin', p); $('#pinScr').classList.add('hide'); $('#main').innerHTML = '<div class="ld">시트에서 불러오는 중…</div>'; load();
  }).catch(function (e) { toast(errMsg(e)); }).then(function () { b.classList.remove('busy'); });
};
$('#pinIn').onkeydown = function (e) { if (e.key === 'Enter') $('#pinBtn').click(); };

if (S.pin) { var c0 = cached(); if (c0) { setData(c0); render(); } load(); } else showPin();
</script>
